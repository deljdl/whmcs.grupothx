name: Deploy WHMCS Staging

on:
  push:
    branches:
      - upgrade-whmcs-9.1.0

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -e
          cd /home/thxcom/whmcs.grupothx.com.br

          backup="$(mktemp)"
          had_htaccess=0
          if [ -f .htaccess ]; then
            cp -p .htaccess "$backup"
            had_htaccess=1
          fi

          restore_htaccess() {
            status=$?
            if [ "$had_htaccess" -eq 1 ]; then
              cp -p "$backup" .htaccess || status=$?
            else
              rm -f .htaccess || status=$?
            fi
            rm -f "$backup" || status=$?
            return "$status"
          }
          trap restore_htaccess EXIT

          /home/thxcom/deploy-whmcs-staging.sh
          REMOTE
